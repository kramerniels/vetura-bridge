<!doctype html>
<html lang="nl" translate="no">
    <head>
        <meta charset="utf-8" />
        <meta name="google" content="notranslate" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vetura status</title>
        <link rel="stylesheet" href="/css/setup.css" />
    </head>
    <body class="page-paired">
        <main>
            <img class="brand" src="/logo.png" alt="Vetura" width="280" height="87" />
            <section class="card">
                <p class="status ok">Gekoppeld</p>
                <h1>Klaar voor opdrachten</h1>
                <p class="lede">
                    Dit apparaat ontvangt opdrachten via NATS.
                </p>
            </section>
            <section class="card" id="worker-section">
                <p class="meta">
                    Apparaat <code>{{deviceId}}</code><br />
                    {{#mdnsHost}}Adres <code>{{mdnsHost}}</code><br />{{/mdnsHost}}
                    {{#addresses}}LAN <code>{{addresses}}</code>{{/addresses}}
                </p>
                <p id="worker-status" class="status warn">Worker…</p>
                <p id="worker-detail" class="meta"></p>
            </section>
            
        </main>
        <script src="/js/paired.js"></script>
    </body>
</html>
