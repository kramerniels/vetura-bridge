# Builds the Raspberry Pi golden image with tools/image/build.sh:
# production on main, staging on every other branch (e.g. development).
# Environment setup: tools/image/README.md (CI section).
name: Image

on:
  push:
    branches: ["**"]
    paths:
      - src/**
      - packaging/**
      - package.json
      - package-lock.json
      - .env.example
      - tools/image/**
      - "!tools/image/README.md"
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        env: ${{ github.ref == 'refs/heads/main' && fromJSON('["production"]') || fromJSON('["staging"]') }}
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - name: Write config.local
        env:
          IMAGE_ENV: ${{ matrix.env }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
          CLOUD_FRONTEND_URL: ${{ vars.CLOUD_FRONTEND_URL }}
          SUPPORT_SSH_PUBKEY: ${{ vars.SUPPORT_SSH_PUBKEY }}
          SECURE_BOOT_KEY: ${{ secrets.SECURE_BOOT_KEY }}
        run: |
          for name in CLOUD_API_URL CLOUD_FRONTEND_URL SUPPORT_SSH_PUBKEY SECURE_BOOT_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not set on the ${IMAGE_ENV} environment"
              exit 1
            fi
          done
          umask 077
          printf '%s\n' "${SECURE_BOOT_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/secure-boot.pem"
          # build.sh reads STAGING_CLOUD_* or PRODUCTION_CLOUD_* depending on IMAGE_ENV.
          prefix="$(printf '%s' "${IMAGE_ENV}" | tr '[:lower:]' '[:upper:]')"
          cat > tools/image/config.local <<EOF
          IMAGE_ENV='${IMAGE_ENV}'
          ${prefix}_CLOUD_API_URL='${CLOUD_API_URL}'
          ${prefix}_CLOUD_FRONTEND_URL='${CLOUD_FRONTEND_URL}'
          PUBKEY_SSH_FIRST_USER='${SUPPORT_SSH_PUBKEY}'
          PUBKEY_ONLY_SSH=1
          SECURE_BOOT_KEY='${RUNNER_TEMP}/secure-boot.pem'
          EOF

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm /opt/microsoft /opt/google
          sudo docker system prune --all --force --volumes
          df -h /

      - name: Build image
        run: tools/image/build.sh

      # archive: false takes one file per step (the artifact keeps its file name).
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          path: tools/image/deploy/*.img.xz
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed boot pair
        uses: actions/upload-artifact@v7
        with:
          path: tools/image/deploy/*-signed-boot.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Signed bootloader EEPROM per board, for provision-secure-boot.sh flash.
  # Holds the public key and signatures only, so it is safe as an artifact.
  eeprom:
    name: eeprom ${{ matrix.board }} ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: ${{ github.ref == 'refs/heads/main' && fromJSON('["production"]') || fromJSON('["staging"]') }}
        board: [pi4, pi5]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - name: Build signed EEPROM bundle
        env:
          IMAGE_ENV: ${{ matrix.env }}
          BOARD: ${{ matrix.board }}
          SECURE_BOOT_KEY: ${{ secrets.SECURE_BOOT_KEY }}
        run: |
          if [[ -z "${SECURE_BOOT_KEY}" ]]; then
            echo "::error::SECURE_BOOT_KEY is not set on the ${IMAGE_ENV} environment"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pycryptodome xxd binutils
          umask 077
          printf '%s\n' "${SECURE_BOOT_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/secure-boot.pem"
          name="secure-boot-${BOARD}-${IMAGE_ENV}-$(git rev-parse --short=7 HEAD)"
          tools/image/provision-secure-boot.sh build --board "${BOARD}" --env "${IMAGE_ENV}" \
            --key "${RUNNER_TEMP}/secure-boot.pem" --out "${RUNNER_TEMP}/${name}"
          rm -f "${RUNNER_TEMP}/secure-boot.pem"
          tar -C "${RUNNER_TEMP}" -czf "${name}.tar.gz" "${name}"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          path: secure-boot-*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
